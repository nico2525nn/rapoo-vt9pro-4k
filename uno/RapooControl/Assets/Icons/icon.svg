<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon background.

  Intentionally empty: Uno's resizetizer paints the background canvas with a
  single color (UnoIconBackgroundColor), so a rounded plate cannot live here.
  The plate and the R are both in icon_foreground.svg, which is composited 1:1
  over this transparent canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="none"/>
</svg>
